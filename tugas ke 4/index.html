<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Explorer API</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🛍️ Product Explorer</h1>
      <p>Jelajahi berbagai produk dengan fitur pencarian, filter, dan pengurutan.</p>
    </header>

    <!-- Controls Section -->
    <section class="controls">
      <div class="control-group">
        <label for="search-input">🔍 Cari Produk</label>
        <input type="text" id="search-input" placeholder="Ketik nama produk...">
      </div>

      <div class="control-group">
        <label for="category-select">🏷️ Kategori</label>
        <select id="category-select">
          <option value="">Semua Kategori</option>
        </select>
      </div>

      <div class="control-group">
        <label for="sort-select">↕️ Urutkan</label>
        <select id="sort-select">
          <option value="default">Default</option>
          <option value="price-asc">Harga Terendah</option>
          <option value="price-desc">Harga Tertinggi</option>
          <option value="rating-desc">Rating Tertinggi</option>
          <option value="name-asc">Nama A - Z</option>
        </select>
      </div>

      <div class="control-group btn-container">
        <button id="reset-btn" class="btn btn-secondary">🔄 Reset Filter</button>
      </div>
    </section>

    <!-- Product Counter & Status -->
    <div class="status-bar">
      <span id="product-counter">Memuat produk...</span>
    </div>

    <!-- Product Grid -->
    <main id="product-grid" class="product-grid"></main>
  </div>

  <!-- Detail Product Modal -->
  <div id="product-modal" class="modal" aria-hidden="true">
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-content">
      <button id="close-modal-btn" class="close-btn">&times;</button>
      <div id="modal-body" class="modal-body">
        <!-- Content injected dynamically via JS -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
